[window]
padding = { x = 14, y = 14 }
opacity = 0.95
dynamic_title = true

[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }

[colors.primary]
background = "#f2e9de"
foreground = "#575268"

[colors.normal]
black   = "#d3cec4"
red     = "#c34043"
green   = "#40a02b"
yellow  = "#d8a657"
blue    = "#9c6644"
magenta = "#575268"
cyan    = "#89b482"
white   = "#575268"

[colors.bright]
black   = "#d3cec4"
red     = "#c34043"
green   = "#40a02b"
yellow  = "#d8a657"
blue    = "#9c6644"
magenta = "#575268"
cyan    = "#89b482"
white   = "#575268"
