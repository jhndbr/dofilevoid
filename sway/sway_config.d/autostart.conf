###############################################################
#                         AUTOSTART                           #
###############################################################
# Description:                                                #
#     Applications and background daemons for Sway on Void    #
###############################################################

# Audio daemons (PipeWire & WirePlumber)
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway 2>/dev/null || dbus-update-activation-environment --all 2>/dev/null
exec pipewire &
exec wireplumber &
exec pipewire-pulse &

# Polkit Authentication Agent (GUI sudo prompts)
exec /usr/libexec/polkit-gnome-authentication-agent-1 || exec lxqt-policykit-agent || exec lxpolkit &

# Notification Daemon
exec mako &

# Clipboard Manager (cliphist / wl-paste)
exec wl-paste --type text --watch cliphist store 2>/dev/null &
exec wl-paste --type image --watch cliphist store 2>/dev/null &

# Initial Theme & Background Setup
exec $HOME/.local/bin/switch auto

# Brightness & Volume Initial Values (safe fallback)
exec brightnessctl s 50% 2>/dev/null
exec wpctl set-volume @DEFAULT_SINK@ 40% 2>/dev/null

# Swayidle & Swaylock (Screen locker & DPMS power management)
exec swayidle -w \
    timeout 300 'if [ -f $HOME/Pictures/blurred_wallpaper_void.jpg ]; then swaylock -f -i $HOME/Pictures/blurred_wallpaper_void.jpg; else swaylock -f -c 1e1e2e; fi' \
    timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    before-sleep 'if [ -f $HOME/Pictures/blurred_wallpaper_void.jpg ]; then swaylock -f -i $HOME/Pictures/blurred_wallpaper_void.jpg; else swaylock -f -c 1e1e2e; fi'
