###############################################################
#                          INPUTS                             #
###############################################################
# Description:                                                #
#     Configure input devices (keyboard, touchpad, pointer)   #
###############################################################

# Keyboard configuration
# Useful layouts: "es" (Spanish), "latam" (Latin America), "us" (US), "us,es"
input "type:keyboard" {
    xkb_layout "es,latam,us"
    xkb_options "grp:alt_shift_toggle,caps:escape"
    xkb_model "pc105"
    repeat_delay 300
    repeat_rate 50
}

# Touchpad configuration
input "type:touchpad" {
    dwt enabled
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
    accel_profile "adaptive"
    pointer_accel 0.3
    scroll_factor 0.8
}

# Mouse / Pointer configuration
input "type:pointer" {
    accel_profile "flat"
    pointer_accel 0
}
