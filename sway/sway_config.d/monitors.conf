###############################################################
#                          MONITORS                           #
###############################################################
# Description:                                                #
#     Define monitor outputs and display configurations       #
# Notes:                                                      #
#     - Run `swaymsg -t get_outputs` to list connected screens#
#     - Use `wlr-randr` or `kanshi` for dynamic profiles      #
###############################################################

# Universal default configuration for any monitor
output * {
    adaptive_sync off
    subpixel rgb
}

# Example configurations (uncomment and adjust as needed):
#
# Laptop display:
# output eDP-1 mode 1920x1080@60Hz position 0,0 scale 1
#
# External Monitor:
# output HDMI-A-1 mode 1920x1080@60Hz position 1920,0 scale 1
#
# Workspace assignments (optional):
# workspace 1 output eDP-1
# workspace 2 output eDP-1
# workspace 3 output HDMI-A-1
