###############################################################
#                        WINDOW RULES                         #
###############################################################
# Description:                                                #
#     Application rules, floating windows, and workspace maps #
###############################################################

# --- Floating Windows ---
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="Preferences"] floating enable

# Specific app floating rules
for_window [app_id="pavucontrol"] floating enable, resize set width 600px height 450px
for_window [app_id="nm-connection-editor"] floating enable
for_window [app_id="imv"] floating enable
for_window [app_id="mpv"] floating enable, resize set width 960px height 540px
for_window [app_id="floating_shell"] floating enable, resize set width 800px height 500px

# Polkit & Authentication Dialogs
for_window [app_id="lxqt-policykit-agent"] floating enable
for_window [app_id="polkit-gnome-authentication-agent-1"] floating enable

# Inhibit idle when fullscreen
for_window [class=".*"] inhibit_idle fullscreen
for_window [app_id=".*"] inhibit_idle fullscreen

# --- Workspace Assignments ---
assign [app_id="firefox"] workspace 1
assign [app_id="org.keepassxc.KeePassXC"] workspace 4
