###############################################################
#                        KEYBINDINGS                          #
###############################################################
# Description:                                                #
#     Custom keybindings for Sway window manager              #
#     Mod Key: Super / Windows Key (Mod4)                     #
###############################################################

set $mod Mod4

# Navigation keys (Vim-style)
set $left h
set $down j
set $up k
set $right l

# Preferred Applications
set $term alacritty
set $menu fuzzel
set $browser firefox
set $file_manager nnn
set $terminal_multiplexer tmux
set $power_menu $HOME/.local/bin/power_menu.sh
set $switch_theme $HOME/.local/bin/switch

# --- Applications & Launchers ---
bindsym $mod+Return exec $term
bindsym $mod+q kill
bindsym $mod+d exec $menu
bindsym $mod+b exec $browser
bindsym $mod+f exec $term -e $file_manager
bindsym $mod+t exec $term -e $terminal_multiplexer
bindsym $mod+Shift+t exec $switch_theme toggle
bindsym $mod+Shift+x exec $power_menu
bindsym $mod+Escape exec $power_menu

# --- Audio Controls ---
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_SINK@ 5%-
bindsym XF86AudioRaiseVolume exec wpctl set-volume -l 1.5 @DEFAULT_SINK@ 5%+
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_SINK@ toggle
bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_SOURCE@ toggle

# --- Brightness Controls ---
bindsym XF86MonBrightnessDown exec brightnessctl s 5%-
bindsym XF86MonBrightnessUp exec brightnessctl s +5%

# --- Screenshots (grim + slurp + wl-copy) ---
# Area selection -> Clipboard & File
bindsym Shift+Alt+p exec mkdir -p $(xdg-user-dir PICTURES 2>/dev/null || echo $HOME/Pictures)/Screenshots && grim -g "$(slurp)" "$(xdg-user-dir PICTURES 2>/dev/null || echo $HOME/Pictures)/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S_grim.png')" && wl-copy < "$(xdg-user-dir PICTURES 2>/dev/null || echo $HOME/Pictures)/Screenshots/$(ls -t $(xdg-user-dir PICTURES 2>/dev/null || echo $HOME/Pictures)/Screenshots | head -n1)" && notify-send -a "Grim" "Captura guardada" "Área copiada al portapapeles y guardada en Screenshots"
bindsym $mod+Shift+s exec mkdir -p $(xdg-user-dir PICTURES 2>/dev/null || echo $HOME/Pictures)/Screenshots && grim -g "$(slurp)" "$(xdg-user-dir PICTURES 2>/dev/null || echo $HOME/Pictures)/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S_grim.png')" && notify-send -a "Grim" "Captura guardada" "Área guardada en Screenshots"

# Fullscreen screenshot
bindsym Print exec mkdir -p $(xdg-user-dir PICTURES 2>/dev/null || echo $HOME/Pictures)/Screenshots && grim "$(xdg-user-dir PICTURES 2>/dev/null || echo $HOME/Pictures)/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S_full.png')" && notify-send -a "Grim" "Captura de pantalla completa guardada"

# --- Window State & Layouts ---
bindsym $mod+Shift+space floating toggle
floating_modifier $mod normal

bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m '¿Deseas cerrar la sesión de Sway?' -B 'Cerrar sesión' 'swaymsg exit'

# Focus navigation (Vim & Arrow keys)
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move focused window
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# --- Workspaces (Standard 1-10 number keys) ---
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

# Move container to workspace
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# --- Scratchpad ---
bindsym $mod+Shift+minus move to scratchpad
bindsym $mod+minus scratchpad show

# --- Floating window positioning and resizing ---
bindsym $mod+Ctrl+h move left 20px
bindsym $mod+Ctrl+j move down 20px
bindsym $mod+Ctrl+k move up 20px
bindsym $mod+Ctrl+l move right 20px
bindsym $mod+Ctrl+Shift+h resize shrink width 20px
bindsym $mod+Ctrl+Shift+l resize grow width 20px
bindsym $mod+Ctrl+Shift+j resize grow height 20px
bindsym $mod+Ctrl+Shift+k resize shrink height 20px

# --- Layout Switching ---
bindsym $mod+n splith
bindsym $mod+v splitv
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+m fullscreen toggle
